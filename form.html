<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
     <header>
        <h1>Contattami</h1>
        <p>Compila il form per scrivermi. Ti rispondo entro 24 ore.</p>
    </header>

        <label for="name"> Nome</label> <br>
        <input type="text" id="name" placeholder="il tuo nome"/> <br>
        <br>
        <label for="email"> Email</label> <br>
        <input type="email" id="email" placeholder="tu@esempio.it"/> <br>
        <br>
        <label for="frequency"> Motivo del contatto</label> <br>
        <select id="frequency">
            <option value="informazioni">Informazioni</option>
            <option value="lavoro">Lavoro</option>
            <option value="altro">Altro</option>
            <br>
        </select>
        <br>

        <label for="joindate"> Data preferita per la risposta</label> <br>
       <input type="date" id="joindate"/> <br>
       <br>
        <label for="message"> Messaggio</label> <br>
        <textarea id="message" placeholder="Scrivi qui il tuo messaggio..."></textarea>
        <br>


        <input type="checkbox" id="checkbox"/> 
        <label for="checkbox"> Accetto di essere ricontattato all'indirizzo indicato</label> <br>


        <button type="submit">Invia</button>

     
    </form>
</body>
</html>
